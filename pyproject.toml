[project]
name = "predict-sjogrens"
version = "2.0.0"
description = "Neural network that scores whole-blood gene expression for a Sjögren's syndrome signature"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "flask>=3.1.3",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside Keras/TensorFlow internals under NumPy 2, not by this project.
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.2.0",
]
