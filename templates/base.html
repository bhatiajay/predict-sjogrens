<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Sjögren's Syndrome Expression Score{% endblock %}</title>
  <style>
    :root {
      --bg: #eef2f4;
      --surface: #ffffff;
      --surface-2: #f4f7f9;
      --surface-3: #e3e9ee;
      --text: #15202b;
      --text-2: #4b5966;
      --border: #d8e0e6;
      --border-strong: #b7c3cd;
      --accent: #1f63a0;
      --accent-hover: #18548a;
      --accent-tint: #e3eef8;
      --on-accent: #ffffff;
      --control: #0f766e;
      --patient: #c76a06;
      --warn-bg: #fdf3e1;
      --warn-text: #7a4a05;
      --warn-mark: #b45309;
      --error: #b42318;
      --error-bg: #fdecea;
      --shadow: 0 1px 2px rgb(16 24 40 / 0.05), 0 6px 20px rgb(16 24 40 / 0.06);
      --shadow-pop: 0 2px 6px rgb(16 24 40 / 0.08), 0 12px 32px rgb(16 24 40 / 0.16);
      --radius: 12px;
      --radius-sm: 8px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1419;
        --surface: #151d24;
        --surface-2: #1b252e;
        --surface-3: #2e3d4b;
        --text: #e6edf3;
        --text-2: #a5b3bf;
        --border: #263340;
        --border-strong: #3a4a58;
        --accent: #2f74b5;
        --accent-hover: #3a82c6;
        --accent-tint: #18324a;
        --control: #3fb8a6;
        --patient: #f0a24a;
        --warn-bg: #33270f;
        --warn-text: #f2cf8c;
        --warn-mark: #f0a24a;
        --error: #ff8f85;
        --error-bg: #3a1a18;
        --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 20px rgb(0 0 0 / 0.25);
        --shadow-pop: 0 2px 6px rgb(0 0 0 / 0.35), 0 12px 32px rgb(0 0 0 / 0.45);
      }
      .link, .chip[aria-current="true"], .gene-trigger[aria-expanded="true"] { color: #8cc4f5; }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--border-strong) var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 1rem/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      caret-color: var(--accent);
    }
    ::selection { background: var(--accent-tint); color: var(--text); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    h1, h2, p, dl, dd { margin: 0; }
    code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .icon { width: 1rem; height: 1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    .page { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
    .page-header { margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
    h2 { font-size: 1.0625rem; line-height: 1.3; font-weight: 650; }
    .lead { margin-top: 0.625rem; color: var(--text-2); max-width: 62ch; }
    .num { font-variant-numeric: tabular-nums; }

    .link { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .link:hover { text-decoration-thickness: 2px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .panel-section { padding: 1.25rem 1.5rem; }
    .panel-section + .panel-section { border-top: 1px solid var(--border); }

    /* Example values */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem 1.5rem; }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
    .chips-label { color: var(--text-2); font-size: 0.875rem; margin-right: 0.25rem; }
    .chip {
      display: inline-flex; align-items: center; min-height: 2rem; padding: 0 0.75rem;
      border: 1px solid var(--border-strong); border-radius: 999px;
      color: var(--text); font-size: 0.875rem; text-decoration: none; white-space: nowrap;
      transition: background-color 150ms var(--ease-out), border-color 150ms var(--ease-out);
    }
    .chip:hover { background: var(--surface-2); border-color: var(--text-2); }
    .chip[aria-current="true"] { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); font-weight: 600; }

    .legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; color: var(--text-2); font-size: 0.8125rem; }
    .legend span { display: inline-flex; align-items: center; gap: 0.375rem; }
    .swatch { width: 3px; height: 0.875rem; border-radius: 2px; }
    .swatch-control { background: var(--control); }
    .swatch-patient { background: var(--patient); }
    .swatch-value { width: 0.625rem; height: 0.625rem; border-radius: 50%; border: 2px solid var(--text); background: var(--surface); }

    /* Gene rows */
    .gene-row { display: grid; grid-template-columns: minmax(0, 1fr) 9rem; gap: 0.375rem 1.5rem; align-items: center; padding: 1.125rem 1.5rem; }
    .gene-row + .gene-row { border-top: 1px solid var(--border); }
    .gene-head { min-width: 0; }
    .gene-name { display: block; color: var(--text-2); font-size: 0.875rem; line-height: 1.35; margin-top: 0.125rem; }
    label.gene-name { cursor: pointer; }
    .gene-row .track { grid-column: 1 / -1; }

    .gene-trigger {
      display: inline-flex; align-items: center; gap: 0.375rem;
      margin: -0.25rem 0 -0.25rem -0.375rem; padding: 0.25rem 0.375rem;
      border: 0; border-radius: 6px; background: none; color: var(--text);
      font: inherit; font-size: 1.0625rem; font-weight: 650; letter-spacing: 0.01em; cursor: pointer;
      transition: background-color 150ms var(--ease-out), color 150ms var(--ease-out);
    }
    .gene-trigger .symbol { text-decoration: underline dotted var(--border-strong); text-decoration-thickness: 2px; text-underline-offset: 4px; }
    .gene-trigger .icon { color: var(--text-2); transition: color 150ms var(--ease-out); }
    .gene-trigger:hover { background: var(--surface-2); }
    .gene-trigger:hover .icon { color: var(--accent); }
    .gene-trigger[aria-expanded="true"] { background: var(--accent-tint); color: var(--accent); }
    .gene-trigger[aria-expanded="true"] .icon { color: inherit; }
    .gene-trigger[aria-expanded="true"] .symbol { text-decoration-color: currentColor; }

    .field input {
      width: 100%; height: 2.75rem; padding: 0 0.75rem;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text);
      font: inherit; font-size: 1rem; font-variant-numeric: tabular-nums; text-align: right;
      transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
    }
    .field input::placeholder { color: var(--text-2); }
    .field input:hover { border-color: var(--text-2); }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .field input[aria-invalid="true"] { border-color: var(--error); background: var(--error-bg); }
    .field-error { display: flex; align-items: center; gap: 0.375rem; grid-column: 1 / -1; color: var(--error); font-size: 0.875rem; }

    /* Range track: where a value sits between the lowest and highest training values */
    .track { margin-top: 0.375rem; }
    .track-rail { position: relative; height: 6px; margin: 0.5rem 0; border-radius: 3px; background: var(--surface-3); }
    .tick { position: absolute; left: var(--pos); top: -7px; width: 3px; height: 20px; margin-left: -1.5px; border-radius: 2px; }
    .tick-control { background: var(--control); }
    .tick-patient { background: var(--patient); }
    .marker {
      position: absolute; left: var(--pos); top: 50%; width: 0.875rem; height: 0.875rem;
      transform: translate(-50%, -50%); border-radius: 50%;
      border: 2px solid var(--text); background: var(--surface);
      box-shadow: 0 1px 3px rgb(16 24 40 / 0.25);
      transition: left 200ms var(--ease-out), border-color 150ms, background-color 150ms;
    }
    .marker.is-out { border-color: var(--warn-mark); background: var(--warn-mark); }
    .marker[hidden] { display: none; }
    .track-scale { display: flex; justify-content: space-between; gap: 1rem; color: var(--text-2); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .track-note { display: inline-flex; align-items: center; gap: 0.25rem; color: var(--warn-text); font-weight: 600; }
    .track-note .icon { display: none; }
    .track-note.is-shown .icon { display: block; }

    /* Buttons */
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      min-height: 2.75rem; padding: 0 1.25rem; border: 0; border-radius: var(--radius-sm);
      background: var(--accent); color: var(--on-accent);
      font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
      transition: background-color 150ms var(--ease-out), transform 100ms var(--ease-out);
    }
    .button:hover { background: var(--accent-hover); }
    .button:active { transform: translateY(1px); }
    .button:disabled { opacity: 0.65; cursor: progress; transform: none; }
    .button-block { width: 100%; min-height: 3rem; }

    /* Alerts */
    .alert { display: flex; gap: 0.625rem; padding: 0.75rem 0.875rem; border-radius: var(--radius-sm); font-size: 0.9375rem; }
    .alert .icon { margin-top: 0.1875rem; }
    .alert-error { background: var(--error-bg); color: var(--error); }
    .alert-warn { background: var(--warn-bg); color: var(--warn-text); }

    /* Gene explanation popovers */
    .gene-popover {
      width: min(23rem, calc(100vw - 1rem)); max-height: calc(100vh - 1rem); overflow: auto;
      margin: auto; padding: 1rem 1.125rem 1.125rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop);
      font-size: 0.875rem; line-height: 1.5;
      transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
    }
    @starting-style { .gene-popover:popover-open { opacity: 0; transform: translateY(-4px); } }
    .gene-popover:focus { outline: none; }
    .pop-title { font-size: 1rem; line-height: 1.3; font-weight: 650; }
    .pop-title .pop-symbol { margin-right: 0.125rem; }
    .pop-name { color: var(--text-2); font-weight: 400; }
    .tag { display: inline-block; margin-top: 0.5rem; padding: 0.0625rem 0.5rem; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 0.75rem; font-weight: 600; }
    .pop-aka { margin-top: 0.5rem; color: var(--text-2); }
    .pop-body { margin-top: 0.75rem; display: grid; gap: 0.625rem; }
    .pop-body dt { font-weight: 650; font-size: 0.8125rem; }
    .pop-body dd { margin-top: 0.125rem; }
    .pop-medians { display: flex; flex-wrap: wrap; gap: 0.25rem 1rem; }
    .pop-medians span { display: inline-flex; align-items: center; gap: 0.375rem; }
    .pop-link { display: inline-flex; align-items: center; gap: 0.3125rem; margin-top: 0.875rem; font-weight: 600; }
    .pop-link .icon { width: 0.875rem; height: 0.875rem; }

    footer { margin-top: 1.5rem; color: var(--text-2); font-size: 0.8125rem; max-width: 70ch; }

    @media (max-width: 34rem) {
      .page { padding-top: 1.5rem; }
      h1 { font-size: 1.5rem; }
      .panel-section, .gene-row { padding-left: 1rem; padding-right: 1rem; }
      .gene-row { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
    }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="page">
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      Research demo from a science fair project, not a diagnostic tool. The model was trained on
      {{ meta.n_samples if meta else 160 }} whole-blood samples from women (GEO GSE66795), most of them Sjögren's patients.
    </footer>
  </div>
  <script>
  (() => {
    // Gene explanations: hover to preview (mouse), click or tap to pin, Esc or click outside to close.
    const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    const supportsPopover = typeof HTMLElement.prototype.showPopover === "function";
    let current = null;
    let pinned = false;
    let showTimer = 0;
    let hideTimer = 0;

    const triggersFor = (pop) => document.querySelectorAll(`[data-gene-popover="${pop.id}"]`);
    const isOpen = (pop) => pop.matches(":popover-open");

    function place(pop, trigger) {
      const gap = 8, edge = 8;
      const r = trigger.getBoundingClientRect();
      pop.style.inset = "auto";
      pop.style.margin = "0";
      const w = pop.offsetWidth, h = pop.offsetHeight;
      const left = Math.min(Math.max(edge, r.left), window.innerWidth - w - edge);
      let top = r.bottom + gap;
      if (top + h > window.innerHeight - edge && r.top - gap - h >= edge) top = r.top - gap - h;
      top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
    }

    function open(pop, trigger, pin) {
      clearTimeout(hideTimer);
      if (current && current !== pop) close(current);
      if (!isOpen(pop)) pop.showPopover();
      pop._trigger = trigger;
      place(pop, trigger);
      current = pop;
      pinned = pinned || pin;
      triggersFor(pop).forEach((t) => t.setAttribute("aria-expanded", "true"));
    }

    function close(pop, returnFocus) {
      if (isOpen(pop)) pop.hidePopover();
      triggersFor(pop).forEach((t) => t.setAttribute("aria-expanded", "false"));
      if (returnFocus && pop._trigger) pop._trigger.focus();
      if (current === pop) { current = null; pinned = false; }
    }

    if (supportsPopover) {
      document.querySelectorAll("[data-gene-popover]").forEach((trigger) => {
        const pop = document.getElementById(trigger.dataset.genePopover);
        if (!pop) return;

        trigger.addEventListener("click", (event) => {
          event.preventDefault(); // handled here instead of the no-JS popovertarget fallback
          if (current === pop && pinned) {
            close(pop);
          } else {
            open(pop, trigger, true);
            if (event.detail === 0) pop.focus(); // opened from the keyboard: move focus into it
          }
        });

        if (canHover) {
          const scheduleHide = () => {
            clearTimeout(showTimer);
            if (!pinned) hideTimer = setTimeout(() => close(pop), 180);
          };
          trigger.addEventListener("pointerenter", () => {
            clearTimeout(hideTimer);
            if (pinned || current === pop) return; // a pinned explanation stays until dismissed
            showTimer = setTimeout(() => open(pop, trigger, false), 120);
          });
          trigger.addEventListener("pointerleave", scheduleHide);
          pop.addEventListener("pointerenter", () => clearTimeout(hideTimer));
          pop.addEventListener("pointerleave", scheduleHide);
        }
      });

      document.addEventListener("pointerdown", (event) => {
        if (current && !current.contains(event.target) && !current._trigger.contains(event.target)) close(current);
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && current) close(current, true);
      });
      document.addEventListener("focusin", (event) => {
        if (current && pinned && !current.contains(event.target) && !current._trigger.contains(event.target)) close(current);
      });
      let frame = 0;
      const reposition = () => {
        if (!current || frame) return;
        frame = requestAnimationFrame(() => { frame = 0; if (current) place(current, current._trigger); });
      };
      window.addEventListener("scroll", reposition, { passive: true });
      window.addEventListener("resize", reposition);
    }

    // Range tracks follow what you type.
    document.querySelectorAll("input[data-track]").forEach((input) => {
      const track = document.getElementById(input.dataset.track);
      if (!track) return;
      const marker = track.querySelector(".marker");
      const note = track.querySelector(".track-note");
      const noteText = note.querySelector("[data-note-text]");
      const min = Number(track.dataset.min), max = Number(track.dataset.max);
      const setNote = (outside) => {
        note.classList.toggle("is-shown", outside);
        const text = outside ? "Outside training range" : "";
        if (noteText.textContent !== text) noteText.textContent = text; // live region: announced on change
      };
      input.addEventListener("input", () => {
        const raw = input.value.trim();
        const value = Number(raw);
        if (raw === "" || !Number.isFinite(value)) { marker.hidden = true; setNote(false); return; }
        const pos = ((value - min) / (max - min)) * 100;
        const outside = pos < 0 || pos > 100;
        marker.hidden = false;
        marker.style.setProperty("--pos", `${Math.max(0, Math.min(100, pos))}%`);
        marker.classList.toggle("is-out", outside);
        setNote(outside);
      });
    });

    // Loading state on submit, undone if the page is restored from the back/forward cache.
    const form = document.querySelector("form[data-score-form]");
    if (form) {
      const button = form.querySelector("button[type=submit]");
      const label = button.querySelector("[data-label]");
      const idle = label.textContent;
      form.addEventListener("submit", () => {
        button.disabled = true;
        button.setAttribute("aria-busy", "true");
        label.textContent = "Calculating…";
      });
      window.addEventListener("pageshow", (event) => {
        if (!event.persisted) return;
        button.disabled = false;
        button.removeAttribute("aria-busy");
        label.textContent = idle;
      });
    }
  })();
  </script>
</body>
</html>
