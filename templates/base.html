<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sjögren's Syndrome Expression Score{% endblock %}</title>
  <style>
    :root { --accent: #2f7fc1; --accent-dark: #22649b; --error: #b3261e; --warn-bg: #fff6e0; --muted: #5f6b76; }
    * { box-sizing: border-box; }
    body { font-family: Arial, Helvetica, sans-serif; background: #eef2f3; margin: 0; padding: 24px 16px; color: #1d2329; }
    .container { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.12); }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { line-height: 1.5; }
    .muted { color: var(--muted); font-size: 0.9rem; }
    a { color: var(--accent); }
    .field { margin: 14px 0; }
    label { display: block; font-weight: bold; }
    label .probe { font-weight: normal; color: var(--muted); font-size: 0.85rem; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #c9d1d8; border-radius: 6px; font-size: 1rem; }
    input.invalid { border-color: var(--error); }
    .error { color: var(--error); font-size: 0.85rem; margin-top: 4px; }
    .hint { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    button { width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    .examples { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.9rem; }
    .score { font-size: 3rem; font-weight: bold; margin: 8px 0; }
    .bar { height: 12px; background: #e3e8ec; border-radius: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--accent); }
    .warning { background: var(--warn-bg); border-left: 4px solid #e0a100; padding: 10px 12px; margin: 16px 0; font-size: 0.9rem; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.95rem; }
    td { padding: 6px 0; border-bottom: 1px solid #eef0f2; }
    td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    footer { max-width: 560px; margin: 16px auto 0; }
  </style>
</head>
<body>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="muted">
    Research demo from a science fair project, not a diagnostic tool. The model was trained on
    {{ meta.n_samples if meta else 160 }} whole-blood samples from women (GEO GSE66795), most of them Sjögren's patients.
  </footer>
</body>
</html>
